<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核容分厂厂长看板</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="weiwo-page">
  <aside class="weiwo-sidebar">
    <div class="weiwo-logo"><span>W</span>帷幄</div>
    <nav class="weiwo-menu" aria-label="分厂管理菜单">
      <div>当知当行</div>
      <div>CG Compass</div>
      <div>CG Notes</div>
      <div>CG Meeting</div>
      <div>CG Flow</div>
      <div>CG Knowledge</div>
      <div>QMS</div>
      <div>TPM</div>
      <div>HSE</div>
      <div class="active">分厂管理</div>
      <div>WMS</div>
      <div>快捷入口</div>
    </nav>
  </aside>

  <aside class="weiwo-subnav">
    <div class="subnav-title">分厂管理</div>
    <nav aria-label="生产管理菜单">
      <button type="button">生产实时</button>
      <button type="button">智能监盘</button>
      <button type="button" class="open">生产管理</button>
      <div class="subnav-children">
        <button type="button">工序打卡</button>
        <button type="button" class="active">核容锅筒工序打卡</button>
        <button type="button">工艺管理</button>
      </div>
      <button type="button">设计&工艺&质量</button>
      <button type="button">设备管理</button>
      <button type="button">安全管理</button>
      <button type="button">应急管理</button>
      <button type="button">职业健康</button>
    </nav>
  </aside>

  <main class="weiwo-main">
    <header class="weiwo-header">
      <div class="weiwo-title">分厂管理</div>
      <span>生产管理 / 工序打卡 / 核容锅筒工序打卡</span>
    </header>

    <section class="weiwo-content">
      <aside class="order-rail">
        <div class="rail-search">
          <input id="orderSearch" class="field" type="search" placeholder="搜索令号">
        </div>
        <div class="rail-title">令号状态</div>
        <div id="orderList" class="order-list"></div>
      </aside>

      <section class="board">
        <div id="boardHead" class="board-head"></div>
        <div id="processGrid" class="process-grid"></div>
        <section id="recordDrawer" class="record-drawer" hidden></section>
        <section id="planningDrawer" class="planning-drawer" hidden></section>
      </section>
    </section>
  </main>

  <script src="./assets/state.js"></script>
  <script>
    const stateStore = window.DrumDemo;
    let state = stateStore.ensureSeedIfEmpty();
    let selectedDrumId = state.drums[0] ? state.drums[0].drum_id : "";
    let planningOpen = false;
    let recordsOpen = false;

    const orderSearch = document.getElementById("orderSearch");
    const orderList = document.getElementById("orderList");
    const boardHead = document.getElementById("boardHead");
    const processGrid = document.getElementById("processGrid");
    const recordDrawer = document.getElementById("recordDrawer");
    const planningDrawer = document.getElementById("planningDrawer");

    function selectedDrum() {
      return state.drums.find((drum) => drum.drum_id === selectedDrumId) || state.drums[0];
    }

    function drumsByOrder() {
      const map = new Map();
      state.drums.forEach((drum) => {
        if (!map.has(drum.production_order_no)) map.set(drum.production_order_no, []);
        map.get(drum.production_order_no).push(drum);
      });
      return [...map.values()].map((drums) => drums.sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN")));
    }

    function statusClass(status) {
      if (status === "已完成") return "done";
      if (status === "待完成") return "current";
      if (status === "延期") return "delay";
      if (status === "停滞") return "stagnant";
      return "";
    }

    function orderGroup(orderDrums) {
      const rates = orderDrums.map((drum) => stateStore.getCompletionRate(drum));
      const currents = orderDrums.map((drum) => stateStore.getCurrentTask(drum));
      if (rates.every((rate) => rate === 100)) return "已完成";
      if (currents.every((current) => current.process_sequence === 1 && current.status !== "已完成")) return "待启动";
      return "在制";
    }

    function renderOrderList() {
      const keyword = orderSearch.value.trim();
      const orders = drumsByOrder().filter((orderDrums) => {
        const text = orderDrums.map((drum) => `${drum.production_order_no}${drum.project_name}${drum.customer_name}${drum.drawing_no}`).join("");
        return !keyword || text.includes(keyword);
      });
      const groups = ["在制", "待启动", "已完成"];
      orderList.innerHTML = groups.map((group) => {
        const groupOrders = orders.filter((orderDrums) => orderGroup(orderDrums) === group);
        return `
          <section class="order-group">
            <div class="order-group-title">${group}</div>
            ${groupOrders.length ? groupOrders.map((orderDrums) => {
              const first = orderDrums[0];
              const isActive = orderDrums.some((drum) => drum.drum_id === selectedDrumId);
              return `
              <button class="order-item ${isActive ? "active" : ""}" data-order-code="${first.production_order_no}">
                <strong>${first.production_order_no}<em>${orderDrums.length} 个锅筒</em></strong>
                <span>${first.project_name}</span>
                <span>${orderDrums.map((drum) => drum.drawing_no).join(" / ")}</span>
              </button>
            `}).join("") : `<div class="order-empty">暂无</div>`}
          </section>
        `;
      }).join("");
    }

    function renderBoardHead(drum) {
      const current = stateStore.getCurrentTask(drum);
      const orderDrums = state.drums
        .filter((item) => item.production_order_no === drum.production_order_no)
        .sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN"));
      boardHead.innerHTML = `
        <div class="board-title">
          <strong>${drum.production_order_no} ${drum.drum_name}进度</strong>
          <span>${drum.project_name} / ${drum.drawing_no}</span>
          ${orderDrums.length > 1 ? `
            <div class="drum-switcher">
              ${orderDrums.map((item) => `
                <button class="${item.drum_id === drum.drum_id ? "active" : ""}" type="button" data-select-drum="${item.drum_id}">
                  ${item.drawing_no}
                </button>
              `).join("")}
            </div>
          ` : ""}
        </div>
        <div class="board-stat"><span>当前工序</span><strong>${current.process_name}</strong></div>
        <div class="board-stat"><span>计划完工</span><strong>${drum.planned_finish_date}</strong></div>
        <div class="board-stat"><span>最近打卡</span><strong>${drum.last_checkin_time || "暂无"}</strong></div>
        <button id="toggleRecords" class="btn" type="button">${recordsOpen ? "收起记录" : "打卡记录"}</button>
        <button id="togglePlan" class="btn primary" type="button">${planningOpen ? "收起计划" : "计划调整"}</button>
      `;
    }

    function renderProcessGrid(drum) {
      processGrid.innerHTML = drum.tasks.map((task) => `
        <div class="process-pill ${statusClass(task.status)}">
          <strong class="process-name">${task.process_sequence}. ${task.process_name}</strong>
          <small class="process-date">${task.planned_finish_date}</small>
        </div>
      `).join("");
    }

    function fallbackRecords(drum) {
      return drum.tasks
        .filter((task) => task.actual_finish_time)
        .slice()
        .reverse()
        .map((task, index) => ({
          record_id: `${drum.drum_id}-F${index}`,
          process_sequence: task.process_sequence,
          process_name: task.process_name,
          action_type: "finish",
          scan_time: task.actual_finish_time,
          scan_user: task.finish_user || "扫码工人",
        }));
    }

    function renderRecordDrawer(drum) {
      recordDrawer.hidden = !recordsOpen;
      if (!recordsOpen) {
        recordDrawer.innerHTML = "";
        return;
      }
      const records = drum.scanRecords && drum.scanRecords.length ? drum.scanRecords : fallbackRecords(drum);
      recordDrawer.innerHTML = `
        <div class="record-head">
          <div>
            <strong>锅筒工序打卡记录</strong>
            <span>${drum.production_order_no} / ${drum.drawing_no} / ${drum.drum_name}</span>
          </div>
          <span class="record-count">共 ${records.length} 条</span>
        </div>
        ${records.length ? `
          <table class="record-table">
            <thead>
              <tr>
                <th>序号</th>
                <th>工序</th>
                <th>打卡人</th>
                <th>打卡动作</th>
                <th>完成时间</th>
              </tr>
            </thead>
            <tbody>
              ${records.map((record) => `
                <tr>
                  <td>${record.process_sequence || "-"}</td>
                  <td>${record.process_name}</td>
                  <td>${record.scan_user || "扫码工人"}</td>
                  <td>${record.action_type === "finish" ? "完成打卡" : record.action_type}</td>
                  <td>${record.scan_time}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : `<div class="record-empty">暂无打卡记录</div>`}
      `;
    }

    function renderPlanningDrawer(drum) {
      planningDrawer.hidden = !planningOpen;
      if (!planningOpen) {
        planningDrawer.innerHTML = "";
        return;
      }
      planningDrawer.innerHTML = `
        <div class="plan-head">
          <div>
            <strong>锅筒主线工序计划调整</strong>
            <span>只维护锅筒级工序的计划开始和计划完工日期。</span>
          </div>
          <button id="savePlan" class="btn primary" type="button">保存计划</button>
        </div>
        <div class="plan-toolbar">
          <input class="field" value="${drum.production_order_no}" readonly>
          <input class="field" value="${drum.drum_name}" readonly>
          <input class="field" value="${drum.factory}" readonly>
          <input class="field" value="${drum.source_file}" readonly>
        </div>
        <table class="plan-table">
          <thead>
            <tr>
              <th>序号</th>
              <th>主线工序</th>
              <th>状态</th>
              <th>计划开始</th>
              <th>计划完工</th>
            </tr>
          </thead>
          <tbody>
            ${drum.tasks.map((task) => `
              <tr>
                <td>${task.process_sequence}</td>
                <td>${task.process_name}</td>
                <td><span class="status ${task.status === "已完成" ? "done" : "pending"}">${task.status}</span></td>
                <td><input class="field plan-date-input" data-task-id="${task.task_id}" data-field="planned_start_date" type="date" value="${task.planned_start_date}"></td>
                <td><input class="field plan-date-input" data-task-id="${task.task_id}" data-field="planned_finish_date" type="date" value="${task.planned_finish_date}"></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function render() {
      state = stateStore.loadState();
      if (!state.drums.length) state = stateStore.ensureSeedIfEmpty();
      if (!selectedDrum()) selectedDrumId = state.drums[0].drum_id;
      const drum = selectedDrum();
      renderOrderList();
      renderBoardHead(drum);
      renderProcessGrid(drum);
      renderRecordDrawer(drum);
      renderPlanningDrawer(drum);
    }

    orderSearch.addEventListener("input", renderOrderList);
    orderList.addEventListener("click", (event) => {
      const item = event.target.closest("[data-order-code]");
      if (!item) return;
      const orderDrums = state.drums
        .filter((drum) => drum.production_order_no === item.dataset.orderCode)
        .sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN"));
      selectedDrumId = orderDrums[0] ? orderDrums[0].drum_id : selectedDrumId;
      planningOpen = false;
      recordsOpen = false;
      render();
    });

    document.addEventListener("click", (event) => {
      if (event.target.id === "toggleRecords") {
        recordsOpen = !recordsOpen;
        if (recordsOpen) planningOpen = false;
        render();
      }
      const drumButton = event.target.closest("[data-select-drum]");
      if (drumButton) {
        selectedDrumId = drumButton.dataset.selectDrum;
        planningOpen = false;
        recordsOpen = false;
        render();
      }
      if (event.target.id === "togglePlan") {
        planningOpen = !planningOpen;
        if (planningOpen) recordsOpen = false;
        render();
      }
      if (event.target.id === "savePlan") {
        const rows = [];
        document.querySelectorAll(".plan-date-input[data-field='planned_start_date']").forEach((input) => {
          const finishInput = document.querySelector(`.plan-date-input[data-task-id="${input.dataset.taskId}"][data-field="planned_finish_date"]`);
          rows.push({
            task_id: input.dataset.taskId,
            planned_start_date: input.value,
            planned_finish_date: finishInput ? finishInput.value : input.value,
          });
        });
        stateStore.savePlanDates(selectedDrumId, rows);
        render();
      }
    });

    window.addEventListener("storage", render);
    render();
  </script>
</body>
</html>
