<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锅筒图号登记</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="upload-page">
    <main class="upload-box">
      <div class="upload-title">核容分厂锅筒图号登记</div>
      <p class="upload-desc">技术员登记令号、项目名称、锅筒图号、钢板数量，并按锅筒选择实际需要扫码打卡的工序。</p>

      <div class="form-item">
        <label>令号<span style="color: red">*</span></label>
        <input class="field" id="orderCode" type="text" value="" autocomplete="off" />
      </div>

      <div class="form-item">
        <label>项目名称<span style="color: red">*</span></label>
        <input class="field" id="itemName" type="text" value="" autocomplete="off" />
      </div>

      <section class="drum-entry-panel">
        <div class="drum-entry-head">
          <div>
            <strong>锅筒信息</strong>
            <span>每个锅筒独立维护图号、钢板数量和需要打卡的工序。</span>
          </div>
          <button class="btn" id="addDrumBtn" type="button">增加锅筒</button>
        </div>
        <div id="drumRows" class="drum-rows"></div>
      </section>

      <button class="submit-btn" id="submitBtn">保存登记</button>
      <div class="msg" id="msg"></div>
    </main>

    <script src="./assets/state.js"></script>
    <script>
      const orderCodeInput = document.getElementById("orderCode");
      const itemNameInput = document.getElementById("itemName");
      const addDrumBtn = document.getElementById("addDrumBtn");
      const drumRows = document.getElementById("drumRows");
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");
      const processNames = DrumDemo.PROCESS_NAMES;
      let rowId = 0;

      function defaultDrawingNo() {
        const orderCode = orderCodeInput.value.trim();
        if (!orderCode) return "";
        const count = drumRows.querySelectorAll(".drum-row").length + 1;
        return `${orderCode}.${String(count).padStart(3, "0")}.0`;
      }

      function processChoices(selected = processNames) {
        const selectedSet = new Set(selected);
        return processNames.map((processName) => `
          <label class="process-choice">
            <input type="checkbox" value="${processName}" ${selectedSet.has(processName) ? "checked" : ""} />
            <span>${processName}</span>
          </label>
        `).join("");
      }

      function addDrumRow(value = "", options = {}) {
        rowId += 1;
        const drawingValue = value || (options.useDefault === false ? "" : defaultDrawingNo());
        const row = document.createElement("div");
        row.className = "drum-row";
        row.dataset.rowId = String(rowId);
        row.innerHTML = `
          <div class="drum-row-main">
            <span class="drum-row-index">${drumRows.children.length + 1}</span>
            <span class="drum-name-fixed"></span>
            <input class="field drum-drawing" type="text" value="${drawingValue}" placeholder="例如：1150053.001.0" autocomplete="off" />
            <label class="plate-count-label">
              <span>钢板数量</span>
              <input class="field plate-count" type="number" min="1" step="1" value="${options.plateCount || 1}" />
            </label>
            <button class="btn" type="button" data-remove-row>移除</button>
          </div>
          <div class="process-config">
            <div class="process-config-head">
              <span>该锅筒经历的工序</span>
              <div>
                <button class="text-btn" type="button" data-select-all>全选</button>
                <button class="text-btn" type="button" data-clear-processes>清空</button>
              </div>
            </div>
            <div class="process-choice-grid">${processChoices(options.processNames)}</div>
          </div>
        `;
        drumRows.appendChild(row);
        syncRowState();
      }

      function syncRowState() {
        const rows = [...drumRows.querySelectorAll(".drum-row")];
        rows.forEach((row, index) => {
          row.querySelector(".drum-row-index").textContent = index + 1;
          row.querySelector(".drum-name-fixed").textContent = `锅筒 ${index + 1}`;
          row.querySelector("[data-remove-row]").disabled = rows.length === 1;
        });
        syncAddButtonState();
      }

      function syncAddButtonState() {
        const firstDrawing = drumRows.querySelector(".drum-drawing")?.value.trim() || "";
        addDrumBtn.disabled = !firstDrawing;
      }

      function readPayload() {
        const orderCode = orderCodeInput.value.trim();
        const itemName = itemNameInput.value.trim();
        const drums = [...drumRows.querySelectorAll(".drum-row")].map((row, index) => ({
          drawingNo: row.querySelector(".drum-drawing").value.trim(),
          drumName: `锅筒 ${index + 1}`,
          plateCount: Number(row.querySelector(".plate-count").value),
          processNames: [...row.querySelectorAll(".process-choice input:checked")].map((input) => input.value),
        }));
        return { orderCode, itemName, drums };
      }

      function validate(payload) {
        if (!payload.orderCode) return "请输入令号";
        if (!payload.itemName) return "请输入项目名称";
        if (!payload.drums.length || payload.drums.some((drum) => !drum.drawingNo)) return "请填写锅筒图号";
        if (payload.drums.some((drum) => !Number.isInteger(drum.plateCount) || drum.plateCount <= 0)) return "请填写有效的钢板数量";
        if (payload.drums.some((drum) => !drum.processNames.length)) return "每个锅筒至少选择一道工序";
        const drawingSet = new Set(payload.drums.map((drum) => drum.drawingNo));
        if (drawingSet.size !== payload.drums.length) return "同一个令号下的锅筒图号不能重复";
        return "";
      }

      addDrumBtn.addEventListener("click", () => {
        if (addDrumBtn.disabled) return;
        addDrumRow();
      });

      drumRows.addEventListener("input", (event) => {
        if (!event.target.classList.contains("drum-drawing")) return;
        syncAddButtonState();
      });

      drumRows.addEventListener("click", (event) => {
        const button = event.target.closest("[data-remove-row]");
        if (!button) return;
        button.closest(".drum-row").remove();
        syncRowState();
      });

      drumRows.addEventListener("click", (event) => {
        const row = event.target.closest(".drum-row");
        if (!row) return;
        if (event.target.closest("[data-select-all]")) {
          row.querySelectorAll(".process-choice input").forEach((input) => {
            input.checked = true;
          });
        }
        if (event.target.closest("[data-clear-processes]")) {
          row.querySelectorAll(".process-choice input").forEach((input) => {
            input.checked = false;
          });
        }
      });

      submitBtn.addEventListener("click", () => {
        const payload = readPayload();
        const error = validate(payload);
        if (error) return showMsg(error, "error");

        const conflict = DrumDemo.getRegistrationConflict(payload.orderCode, payload.drums.map((drum) => drum.drawingNo));
        if (conflict?.orderDrums.length) {
          return showMsg("该令号已经登记，不允许重复提交", "error");
        }

        runRegistration(payload);
      });

      function runRegistration(payload) {
        submitBtn.disabled = true;
        submitBtn.textContent = "保存中...";
        setTimeout(() => {
          const result = DrumDemo.registerDrums({ ...payload, mode: "safeMerge", sourceName: "手工登记" });
          submitBtn.disabled = false;
          submitBtn.textContent = "保存登记";
          resetForm();
          showMsg(`保存成功：已登记 ${payload.orderCode} ${result.changedDrums.length} 个锅筒。`, "success");
        }, 250);
      }

      function resetForm() {
        orderCodeInput.value = "";
        itemNameInput.value = "";
        drumRows.innerHTML = "";
        rowId = 0;
        addDrumRow("", { useDefault: false });
      }

      function showMsg(text, type) {
        msg.textContent = text;
        msg.className = `msg show ${type}`;
      }

      addDrumRow("", { useDefault: false });
    </script>
  </body>
</html>
