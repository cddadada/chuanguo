<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow 生产工序跟踪</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="weiwo-page">
  <aside class="weiwo-sidebar">
    <div class="weiwo-logo"><span>W</span>帷幄</div>
    <nav class="weiwo-menu" aria-label="应用菜单">
      <div>当知当行</div>
      <div>CG Compass</div>
      <div>CG Notes</div>
      <div>CG Meeting</div>
      <div class="active">CG Flow</div>
      <div>CG Knowledge</div>
      <div>QMS</div>
      <div>TPM</div>
      <div>HSE</div>
      <div>分厂管理</div>
      <div>WMS</div>
      <div>快捷入口</div>
    </nav>
  </aside>

  <aside class="weiwo-subnav">
    <div class="subnav-title flow-logo">Flow</div>
    <nav aria-label="CG Flow 菜单">
      <button type="button">关键指标</button>
      <button type="button">月度生产看板</button>
      <button type="button">分厂工序计划</button>
      <button type="button" class="open">生产执行</button>
      <div class="subnav-children">
        <button type="button" class="active">生产工序跟踪</button>
        <button type="button">生产监控</button>
        <button type="button">龙盾机器人</button>
        <button type="button">分厂驾驶舱</button>
        <button type="button">班组DMS看板</button>
      </div>
      <button type="button">完工项目清单</button>
      <button type="button">产出日报</button>
    </nav>
  </aside>

  <main class="weiwo-main">
    <header class="weiwo-header">
      <div class="weiwo-title">组件生产工序跟踪</div>
      <span>CG Flow / 生产执行 / 生产工序跟踪 / 锅筒</span>
    </header>

    <section class="weiwo-content tracking-content">
      <section class="board">
        <div class="tracking-filter-head">
          <div>
            <strong>组件生产工序跟踪</strong>
          </div>
        </div>
        <div class="tracking-filterbar">
          <label>
            <span>计划月份：</span>
            <input class="field month-field" type="month" value="2026-06">
            <em>至</em>
            <input class="field month-field" type="month" value="2026-06">
          </label>
          <label>
            <span>状态：</span>
            <select id="trackingStatus" class="field select-field">
              <option value="在制">执行中</option>
              <option value="待启动">待启动</option>
              <option value="已完成">已完工</option>
              <option value="全部">全部</option>
            </select>
          </label>
          <label>
            <span>生产令号：</span>
            <select id="trackingOrderSelect" class="field select-field"></select>
          </label>
          <div class="selected-orders">
            <span>已选择：</span>
            <strong id="selectedOrderCount">0 个令号</strong>
          </div>
        </div>
        <div class="flow-component-tabs">
          <button type="button">膜式壁</button>
          <button type="button">蛇形管</button>
          <button type="button">集箱</button>
          <button type="button" class="active">锅筒</button>
        </div>
        <div id="boardHead" class="board-head"></div>
        <div id="orderDrumBoards" class="drum-board-list"></div>
      </section>
    </section>
  </main>

  <script src="./assets/state.js"></script>
  <script>
    const stateStore = window.DrumDemo;
    let state = stateStore.ensureSeedIfEmpty();
    let selectedOrderCode = state.drums[0] ? state.drums[0].production_order_no : "";
    let planningDrumId = "";
    let recordsDrumId = "";
    let currentOrderFilter = "在制";
    const currentViewer = { name: "周建国", role: "厂长", canViewRecords: true, canAdjustPlan: true };

    const trackingStatus = document.getElementById("trackingStatus");
    const trackingOrderSelect = document.getElementById("trackingOrderSelect");
    const selectedOrderCount = document.getElementById("selectedOrderCount");
    const boardHead = document.getElementById("boardHead");
    const orderDrumBoards = document.getElementById("orderDrumBoards");

    function selectedOrderDrums() {
      if (!selectedOrderCode) return [];
      const drums = state.drums
        .filter((drum) => drum.production_order_no === selectedOrderCode)
        .sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN"));
      return drums;
    }

    function drumsByOrder() {
      const map = new Map();
      state.drums.forEach((drum) => {
        if (!map.has(drum.production_order_no)) map.set(drum.production_order_no, []);
        map.get(drum.production_order_no).push(drum);
      });
      return [...map.values()].map((drums) => drums.sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN")));
    }

    function statusClass(status) {
      if (status === "已完成") return "done";
      if (status === "待完成") return "current";
      if (status === "延期") return "delay";
      if (status === "停滞") return "stagnant";
      return "";
    }

    function taskVisualState(drum, task) {
      const quantityProcessSet = new Set(["备料", "纵缝", "纵缝探伤", "环缝", "环缝探伤"]);
      if (quantityProcessSet.has(task.process_name)) {
        const total = stateStore.getProcessTargetQuantity(drum, task.process_name);
        const done = taskFinishedQuantity(drum, task);
        if (done >= total) return "done";
        if (done > 0) return "running";
        return "not-started";
      }
      if (task.status === "已完成") return "done";
      return "not-started";
    }

    function orderGroup(orderDrums) {
      const rates = orderDrums.map((drum) => stateStore.getCompletionRate(drum));
      const currents = orderDrums.map((drum) => stateStore.getCurrentTask(drum));
      if (rates.every((rate) => rate === 100)) return "已完成";
      if (currents.every((current) => current.process_sequence === 1 && current.status !== "已完成")) return "待启动";
      return "在制";
    }

    function filteredOrders() {
      const orders = drumsByOrder();
      if (currentOrderFilter === "全部") return orders;
      return orders.filter((orderDrums) => orderGroup(orderDrums) === currentOrderFilter);
    }

    function renderTopFilters() {
      const orders = filteredOrders();
      if (!orders.some((orderDrums) => orderDrums[0].production_order_no === selectedOrderCode)) {
        selectedOrderCode = orders[0]?.[0]?.production_order_no || "";
      }
      trackingOrderSelect.innerHTML = orders.length ? orders.map((orderDrums) => {
        const first = orderDrums[0];
        return `
          <option value="${first.production_order_no}" ${first.production_order_no === selectedOrderCode ? "selected" : ""}>
            ${first.production_order_no} ${first.project_name}
          </option>
        `;
      }).join("") : `<option value="">请选择</option>`;
      selectedOrderCount.textContent = selectedOrderCode ? "1 个令号" : "0 个令号";
    }

    function renderBoardHead(orderDrums) {
      if (!orderDrums.length) {
        boardHead.innerHTML = `
          <div class="board-title">
            <strong>暂无令号进度</strong>
            <span>请先在锅筒图号登记页登记令号和锅筒信息。</span>
          </div>
        `;
        return;
      }
      const first = orderDrums[0];
      boardHead.innerHTML = `
        <div class="board-title">
          <strong>${first.production_order_no} 进度</strong>
          <span>${first.project_name} / ${orderDrums.length} 个锅筒 / ${orderDrums.map((drum) => drum.drawing_no).join("、")}</span>
          <em class="permission-note">当前账号：${currentViewer.name}（${currentViewer.role}）</em>
          <div class="state-legend">
            <span><i class="done"></i>已完成</span>
            <span><i class="running"></i>进行中</span>
            <span><i class="not-started"></i>未开始</span>
          </div>
        </div>
      `;
    }

    function processGridHtml(drum) {
      const quantityProcessSet = new Set(["备料", "纵缝", "纵缝探伤", "环缝", "环缝探伤"]);
      return drum.tasks.map((task) => {
        const visualState = taskVisualState(drum, task);
        return `
          <div class="process-pill ${visualState}">
            <strong class="process-name">${task.process_name}</strong>
            <small class="process-date">计划完成 ${task.planned_finish_date}</small>
            ${quantityProcessSet.has(task.process_name) ? quantityProgressHtml(drum, task) : ""}
          </div>
        `;
      }).join("");
    }

    function taskFinishedQuantity(drum, task) {
      const total = stateStore.getProcessTargetQuantity(drum, task.process_name);
      if (Number(task.finish_quantity) > 0) return Math.min(Number(task.finish_quantity), total);
      return task.status === "已完成" ? total : 0;
    }

    function quantityProgressHtml(drum, task) {
      const total = stateStore.getProcessTargetQuantity(drum, task.process_name);
      const done = taskFinishedQuantity(drum, task);
      const percent = Math.max(0, Math.min(100, Math.round((done / total) * 100)));
      const progressState = percent === 0 ? "empty" : percent === 100 ? "full" : "partial";
      return `
        <div class="process-quantity ${progressState}">
          <span>${done}/${total} 张</span>
          <i><b style="width: ${percent}%"></b></i>
        </div>
      `;
    }

    function fallbackRecords(drum) {
      return drum.tasks
        .filter((task) => task.actual_finish_time)
        .slice()
        .reverse()
        .map((task, index) => ({
          record_id: `${drum.drum_id}-F${index}`,
          process_sequence: task.process_sequence,
          process_name: task.process_name,
          action_type: "finish",
          scan_time: task.actual_finish_time,
          scan_user: task.finish_user || "扫码工人",
        }));
    }

    function recordDrawerHtml(drum) {
      if (recordsDrumId !== drum.drum_id) return "";
      const records = drum.scanRecords && drum.scanRecords.length ? drum.scanRecords : fallbackRecords(drum);
      return `
        <section class="record-drawer">
        <div class="record-head">
          <div>
            <strong>锅筒工序打卡记录</strong>
            <span>${drum.production_order_no} / ${drum.drawing_no} / ${drum.drum_name}</span>
          </div>
          <span class="record-count">共 ${records.length} 条</span>
        </div>
        ${records.length ? `
          <table class="record-table">
            <thead>
              <tr>
                <th>工序</th>
                <th>打卡人</th>
                <th>打卡动作</th>
                <th>累计数量</th>
                <th>完成时间</th>
              </tr>
            </thead>
            <tbody>
              ${records.map((record) => `
                <tr>
                  <td>${record.process_name}</td>
                  <td>${record.scan_user || "扫码工人"}</td>
                  <td>${record.action_type === "finish" ? "完成打卡" : record.action_type === "revoke" ? "撤回打卡" : record.action_type}</td>
                  <td>${record.target_quantity ? `${record.finish_quantity || 0}/${record.target_quantity} 张` : "-"}</td>
                  <td>${record.scan_time}</td>
                </tr>
              `).join("")}
            </tbody>
          </table>
        ` : `<div class="record-empty">暂无打卡记录</div>`}
        </section>
      `;
    }

    function planningDrawerHtml(drum) {
      if (planningDrumId !== drum.drum_id) return "";
      return `
        <section class="planning-drawer">
        <div class="plan-head">
          <div>
            <strong>锅筒主线工序计划调整</strong>
            <span>只维护锅筒级工序的计划开始和计划完工日期。</span>
          </div>
          <button class="btn primary" type="button" data-save-plan="${drum.drum_id}">保存计划</button>
        </div>
        <div class="plan-toolbar">
          <input class="field" value="${drum.production_order_no}" readonly>
          <input class="field" value="${drum.drum_name}" readonly>
          <input class="field" value="${drum.factory}" readonly>
          <input class="field" value="${drum.source_file}" readonly>
        </div>
        <table class="plan-table">
          <thead>
            <tr>
              <th>主线工序</th>
              <th>状态</th>
              <th>计划开始</th>
              <th>计划完工</th>
            </tr>
          </thead>
          <tbody>
            ${drum.tasks.map((task) => `
              <tr>
                <td>${task.process_name}</td>
                <td><span class="status ${task.status === "已完成" ? "done" : "pending"}">${task.status}</span></td>
                <td><input class="field plan-date-input" data-task-id="${task.task_id}" data-field="planned_start_date" type="date" value="${task.planned_start_date}"></td>
                <td><input class="field plan-date-input" data-task-id="${task.task_id}" data-field="planned_finish_date" type="date" value="${task.planned_finish_date}"></td>
              </tr>
            `).join("")}
          </tbody>
        </table>
        </section>
      `;
    }

    function renderDrumBoards(orderDrums) {
      if (!orderDrums.length) {
        orderDrumBoards.innerHTML = `<div class="board-empty">暂无锅筒数据，请先完成锅筒图号登记。</div>`;
        return;
      }
      orderDrumBoards.innerHTML = orderDrums.map((drum, index) => {
        const current = stateStore.getCurrentTask(drum);
        const recordsOpen = recordsDrumId === drum.drum_id;
        const planningOpen = planningDrumId === drum.drum_id;
        return `
          <article class="drum-board-card" data-drum-id="${drum.drum_id}">
            <div class="drum-card-head">
              <div class="drum-card-title">
                <strong>锅筒 ${index + 1}</strong>
                <span>${drum.drawing_no}</span>
                <em>钢板数量：${drum.plate_count || 1} 张</em>
              </div>
              <div class="drum-card-stats">
                <div class="board-stat"><span>已完成工序</span><strong>${drum.tasks.filter((task) => task.status === "已完成").length}/${drum.tasks.length}</strong></div>
                <div class="board-stat"><span>公司计划完工</span><strong>${drum.company_plan_date || drum.planned_finish_date}</strong></div>
                <div class="board-stat"><span>最近打卡</span><strong>${drum.last_checkin_time || "暂无"}</strong></div>
              </div>
              ${(currentViewer.canViewRecords || currentViewer.canAdjustPlan) ? `<div class="drum-card-actions">
                ${currentViewer.canViewRecords ? `
                <button class="btn" type="button" data-toggle-records="${drum.drum_id}">${recordsOpen ? "收起记录" : "打卡记录"}</button>
                ` : ""}
                ${currentViewer.canAdjustPlan ? `
                <button class="btn primary" type="button" data-toggle-plan="${drum.drum_id}">${planningOpen ? "收起计划" : "计划调整"}</button>
                ` : ""}
              </div>` : ""}
            </div>
            <div class="process-grid">${processGridHtml(drum)}</div>
            ${recordDrawerHtml(drum)}
            ${planningDrawerHtml(drum)}
          </article>
        `;
      }).join("");
    }

    function render() {
      state = stateStore.loadState();
      if (!state.drums.some((drum) => drum.production_order_no === selectedOrderCode)) {
        selectedOrderCode = state.drums[0] ? state.drums[0].production_order_no : "";
      }
      renderTopFilters();
      const orderDrums = selectedOrderDrums();
      renderBoardHead(orderDrums);
      renderDrumBoards(orderDrums);
    }

    trackingStatus.addEventListener("change", () => {
      currentOrderFilter = trackingStatus.value;
      planningDrumId = "";
      recordsDrumId = "";
      render();
    });

    trackingOrderSelect.addEventListener("change", () => {
      selectedOrderCode = trackingOrderSelect.value || selectedOrderCode;
      planningDrumId = "";
      recordsDrumId = "";
      render();
    });

    document.addEventListener("click", (event) => {
      const recordsButton = event.target.closest("[data-toggle-records]");
      if (recordsButton) {
        const drumId = recordsButton.dataset.toggleRecords;
        recordsDrumId = recordsDrumId === drumId ? "" : drumId;
        if (recordsDrumId) planningDrumId = "";
        render();
      }
      const planButton = event.target.closest("[data-toggle-plan]");
      if (planButton) {
        const drumId = planButton.dataset.togglePlan;
        planningDrumId = planningDrumId === drumId ? "" : drumId;
        if (planningDrumId) recordsDrumId = "";
        render();
      }
      const savePlanButton = event.target.closest("[data-save-plan]");
      if (savePlanButton) {
        const card = savePlanButton.closest(".drum-board-card");
        const rows = [];
        card.querySelectorAll(".plan-date-input[data-field='planned_start_date']").forEach((input) => {
          const finishInput = card.querySelector(`.plan-date-input[data-task-id="${input.dataset.taskId}"][data-field="planned_finish_date"]`);
          rows.push({
            task_id: input.dataset.taskId,
            planned_start_date: input.value,
            planned_finish_date: finishInput ? finishInput.value : input.value,
          });
        });
        stateStore.savePlanDates(savePlanButton.dataset.savePlan, rows);
        render();
      }
    });

    window.addEventListener("storage", render);
    render();
  </script>
</body>
</html>
