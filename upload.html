<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>锅筒图号登记</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body class="upload-page">
    <main class="upload-box">
      <div class="upload-title">核容分厂锅筒图号登记</div>
      <p class="upload-desc">技术员只需要登记令号、项目名称和该令号下的锅筒图号。一个令号下有多个锅筒时，逐行增加图号。</p>

      <div class="form-item">
        <label>令号（orderCode）<span style="color: red">*</span></label>
        <input class="field" id="orderCode" type="text" value="1150053" autocomplete="off" />
      </div>

      <div class="form-item">
        <label>项目名称（itemName）<span style="color: red">*</span></label>
        <input class="field" id="itemName" type="text" value="大连西太二期1x150t/h角管炉" autocomplete="off" />
      </div>

      <section class="drum-entry-panel">
        <div class="drum-entry-head">
          <div>
            <strong>锅筒图号</strong>
            <span>通常 1 个令号 1 个锅筒；如有多个锅筒，点击“增加锅筒”。</span>
          </div>
          <button class="btn" id="addDrumBtn" type="button">增加锅筒</button>
        </div>
        <div id="drumRows" class="drum-rows"></div>
      </section>

      <button class="submit-btn" id="submitBtn">保存登记</button>
      <section class="conflict-panel" id="conflictPanel" hidden></section>
      <div class="msg" id="msg"></div>
    </main>

    <script src="./assets/state.js"></script>
    <script>
      const orderCodeInput = document.getElementById("orderCode");
      const itemNameInput = document.getElementById("itemName");
      const addDrumBtn = document.getElementById("addDrumBtn");
      const drumRows = document.getElementById("drumRows");
      const submitBtn = document.getElementById("submitBtn");
      const msg = document.getElementById("msg");
      const conflictPanel = document.getElementById("conflictPanel");
      let rowId = 0;
      let pendingRegistration = null;

      function defaultDrawingNo() {
        const orderCode = orderCodeInput.value.trim() || "1150053";
        const count = drumRows.querySelectorAll(".drum-row").length + 1;
        return `${orderCode}.${String(count).padStart(3, "0")}.0`;
      }

      function addDrumRow(value = "") {
        rowId += 1;
        const row = document.createElement("div");
        row.className = "drum-row";
        row.dataset.rowId = String(rowId);
        row.innerHTML = `
          <span class="drum-row-index">${drumRows.children.length + 1}</span>
          <input class="field drum-drawing" type="text" value="${value || defaultDrawingNo()}" placeholder="例如：1150053.001.0" autocomplete="off" />
          <input class="field drum-name" type="text" value="锅筒" autocomplete="off" />
          <button class="btn" type="button" data-remove-row>移除</button>
        `;
        drumRows.appendChild(row);
        syncRowState();
      }

      function syncRowState() {
        const rows = [...drumRows.querySelectorAll(".drum-row")];
        rows.forEach((row, index) => {
          row.querySelector(".drum-row-index").textContent = index + 1;
          row.querySelector("[data-remove-row]").disabled = rows.length === 1;
        });
      }

      function readPayload() {
        const orderCode = orderCodeInput.value.trim();
        const itemName = itemNameInput.value.trim();
        const drums = [...drumRows.querySelectorAll(".drum-row")].map((row) => ({
          drawingNo: row.querySelector(".drum-drawing").value.trim(),
          drumName: row.querySelector(".drum-name").value.trim() || "锅筒",
        }));
        return { orderCode, itemName, drums };
      }

      function validate(payload) {
        if (!payload.orderCode) return "请输入令号";
        if (!payload.itemName) return "请输入项目名称";
        if (!payload.drums.length || payload.drums.some((drum) => !drum.drawingNo)) return "请填写锅筒图号";
        const drawingSet = new Set(payload.drums.map((drum) => drum.drawingNo));
        if (drawingSet.size !== payload.drums.length) return "同一个令号下的锅筒图号不能重复";
        return "";
      }

      addDrumBtn.addEventListener("click", () => {
        addDrumRow();
        hideConflict();
      });

      drumRows.addEventListener("click", (event) => {
        const button = event.target.closest("[data-remove-row]");
        if (!button) return;
        button.closest(".drum-row").remove();
        syncRowState();
        hideConflict();
      });

      submitBtn.addEventListener("click", () => {
        const payload = readPayload();
        const error = validate(payload);
        if (error) return showMsg(error, "error");

        const conflict = DrumDemo.getRegistrationConflict(payload.orderCode, payload.drums.map((drum) => drum.drawingNo));
        if (conflict) {
          pendingRegistration = payload;
          return showConflict(conflict, payload);
        }

        runRegistration(payload);
      });

      conflictPanel.addEventListener("click", (event) => {
        const action = event.target.dataset.action;
        if (!action) return;
        if (action === "cancel") {
          hideConflict();
          showMsg("已取消登记，现有锅筒数据不变。", "error");
          return;
        }
        if (!pendingRegistration) return;
        runRegistration(pendingRegistration);
      });

      function runRegistration(payload) {
        hideConflict();
        submitBtn.disabled = true;
        submitBtn.textContent = "保存中...";
        setTimeout(() => {
          const result = DrumDemo.registerDrums({ ...payload, mode: "safeMerge", sourceName: "手工登记" });
          submitBtn.disabled = false;
          submitBtn.textContent = "保存登记";
          pendingRegistration = null;
          showMsg(`登记成功：${payload.orderCode} 已生成/更新 ${result.changedDrums.length} 个锅筒。`, "success");
        }, 250);
      }

      function showConflict(conflict, payload) {
        msg.className = "msg";
        const existingText = conflict.orderDrums.map((drum) => `${drum.drawing_no}（${DrumDemo.getCurrentTask(drum).process_name}）`).join("、");
        const matchingText = conflict.matchingDrums.length ? conflict.matchingDrums.map((drum) => drum.drawing_no).join("、") : "无";
        conflictPanel.hidden = false;
        conflictPanel.innerHTML = `
          <h2>检测到该令号已有锅筒数据</h2>
          <p>系统不会删除未填写的旧锅筒；本次只新增或更新表单里的图号。已存在图号会保留二维码、打卡记录和已完成工序。</p>
          <div class="conflict-grid">
            <span>令号</span><strong>${payload.orderCode}</strong>
            <span>现有锅筒</span><strong>${existingText}</strong>
            <span>本次命中</span><strong>${matchingText}</strong>
            <span>扫码记录</span><strong>${conflict.scanCount} 条</strong>
            <span>已打印标签</span><strong>${conflict.printedCount} 张</strong>
          </div>
          <div class="conflict-actions">
            <button class="btn" type="button" data-action="cancel">取消</button>
            <button class="btn primary" type="button" data-action="merge">继续登记</button>
          </div>
          <p class="conflict-tip">继续登记：新增图号会生成新二维码；已存在图号只更新项目名称/锅筒名称，保留生产过程数据。</p>
        `;
      }

      function hideConflict() {
        conflictPanel.hidden = true;
        conflictPanel.innerHTML = "";
      }

      function showMsg(text, type) {
        msg.textContent = text;
        msg.className = `msg show ${type}`;
      }

      addDrumRow("1150053.001.0");
    </script>
  </body>
</html>
