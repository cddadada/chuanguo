<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫码完成打卡</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body class="mobile-body">
  <main class="phone">
    <header class="wflow-bar">
      <span>‹</span>
      <strong>工序打卡</strong>
    </header>
    <section class="checkin-content">
      <div id="summaryCard" class="checkin-card"></div>
      <div id="resultMsg" class="toast"></div>
      <div id="progressList" class="progress-list"></div>
      <div id="actionSheet" class="checkin-sheet" hidden></div>
    </section>
  </main>

  <script src="./assets/state.js"></script>
  <script>
    const stateStore = window.DrumDemo;
    const summaryCard = document.getElementById("summaryCard");
    const resultMsg = document.getElementById("resultMsg");
    const progressList = document.getElementById("progressList");
    const actionSheet = document.getElementById("actionSheet");
    const params = new URLSearchParams(window.location.search);
    const rawId = params.get("id") || "";
    const targetId = decodeURIComponent(rawId).split("|")[0] || "";
    let toastTimer = 0;
    let isAdvancing = false;
    let pendingTaskId = "";

    function currentDrum() {
      return stateStore.findDrum(targetId);
    }

    function showToast(message) {
      window.clearTimeout(toastTimer);
      resultMsg.textContent = message;
      resultMsg.classList.add("show");
      toastTimer = window.setTimeout(() => {
        resultMsg.classList.remove("show");
      }, 1800);
    }

    function needsQuantity(task) {
      return stateStore.QUANTITY_PROCESSES.has(task.process_name);
    }

    function taskFinishedQuantity(drum, task) {
      return stateStore.getTaskEffectiveQuantity(drum, task);
    }

    function quantityProgressHtml(drum, task) {
      const total = stateStore.getProcessTargetQuantity(drum, task.process_name);
      const done = taskFinishedQuantity(drum, task);
      const percent = Math.max(0, Math.min(100, Math.round((done / total) * 100)));
      const progressState = percent === 0 ? "empty" : percent === 100 ? "full" : "partial";
      return `
        <div class="task-progress ${progressState}">
          <span>${done}/${total} 张</span>
          <i><b style="width: ${percent}%"></b></i>
        </div>
      `;
    }

    function compactDrawingNo(value) {
      return String(value || "").replace(/\.0$/, "");
    }

    function taskVisualState(task) {
      if (task.status === "已完成") return "done";
      if (needsQuantity(task)) {
        const total = stateStore.getProcessTargetQuantity(currentDrum(), task.process_name);
        const done = Number(task.finish_quantity) || 0;
        if (done > 0 && done < total) return "running";
      }
      return "not-started";
    }

    function closeActionSheet() {
      pendingTaskId = "";
      actionSheet.hidden = true;
      actionSheet.innerHTML = "";
    }

    function openActionSheet(drum, task) {
      pendingTaskId = task.task_id;
      const requiresQuantity = needsQuantity(task);
      const targetQuantity = stateStore.getProcessTargetQuantity(drum, task.process_name);
      const currentQuantity = taskFinishedQuantity(drum, task);
      const today = stateStore.currentTime().slice(0, 10);
      const todayRecord = requiresQuantity ? stateStore.findQuantityRecordByDate(drum, task.process_name, today) : null;
      const remainingQuantity = requiresQuantity ? stateStore.getTaskRemainingQuantity(drum, task) : 0;
      const records = requiresQuantity ? stateStore.quantityRecords(drum, task.process_name) : [];
      actionSheet.hidden = false;
      actionSheet.innerHTML = `
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-panel">
          <strong>${task.process_name}</strong>
          <p>${requiresQuantity ? `当前累计 ${currentQuantity}/${targetQuantity} 张，${todayRecord ? `今天已打卡 ${todayRecord.finish_quantity || 0} 张，不能重复打卡。如需调整，请在历史日报数量中修改今天记录。` : `今天最多可填 ${remainingQuantity} 张。`}` : "确认完成该工序打卡。"}</p>
          ${requiresQuantity ? `
            ${todayRecord ? "" : `
            <label class="sheet-field">
              <span>今天完成数量</span>
              <input id="sheetQuantity" class="quantity-field" type="number" min="1" max="${remainingQuantity}" value="" placeholder="最多 ${remainingQuantity} 张" inputmode="numeric" ${remainingQuantity <= 0 ? "disabled" : ""}>
            </label>
            `}
            <div class="quantity-record-list">
              <b>历史日报数量</b>
              ${records.length ? records.map((record) => `
                <div class="quantity-record">
                  <span>${record.report_date || String(record.scan_time).slice(0, 10)} · ${record.finish_quantity || 0} 张 · ${record.scan_user || "扫码工人"}</span>
                  <button class="text-btn" type="button" data-correct-record="${record.record_id}">修改</button>
                </div>
              `).join("") : `<span class="record-empty">暂无日报数量记录</span>`}
            </div>
          ` : ""}
          <div class="sheet-actions">
            <button class="btn" type="button" data-close-sheet>取消</button>
            ${requiresQuantity && todayRecord ? "" : `<button class="btn primary" type="button" data-confirm-finish="${drum.drum_code}" ${requiresQuantity && remainingQuantity <= 0 ? "disabled" : ""}>确认打卡</button>`}
          </div>
        </div>
      `;
      actionSheet.querySelector("input")?.focus();
    }

    function openCorrectionSheet(drum, task, recordId) {
      pendingTaskId = task.task_id;
      const record = drum.scanRecords.find((item) => item.record_id === recordId);
      if (!record) return;
      const maxQuantity = stateStore.getTaskRemainingQuantity(drum, task, { excludeRecordId: record.record_id });
      actionSheet.innerHTML = `
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-panel">
          <strong>修改${task.process_name}数量</strong>
          <p>${record.report_date || String(record.scan_time).slice(0, 10)} 原记录 ${record.finish_quantity || 0} 张，修改后最多 ${maxQuantity} 张。</p>
          <label class="sheet-field">
            <span>正确的当天完成数量</span>
            <input id="sheetCorrectionQuantity" class="quantity-field" type="number" min="0" max="${maxQuantity}" value="${record.finish_quantity || 0}" inputmode="numeric">
          </label>
          <div class="sheet-actions">
            <button class="btn" type="button" data-close-sheet>取消</button>
            <button class="btn primary" type="button" data-submit-correction="${record.record_id}">确认修改</button>
          </div>
        </div>
      `;
      actionSheet.querySelector("input")?.focus();
    }

    function openCompletedSheet(drum, task) {
      pendingTaskId = task.task_id;
      const quantityText = needsQuantity(task)
        ? `<p>当前记录：${taskFinishedQuantity(drum, task)}/${stateStore.getProcessTargetQuantity(drum, task.process_name)} 张</p>`
        : "";
      actionSheet.hidden = false;
      actionSheet.innerHTML = `
        <div class="sheet-backdrop" data-close-sheet></div>
        <div class="sheet-panel">
          <strong>${task.process_name}</strong>
          <p>该工序已由 ${task.finish_user || "扫码工人"} 在 ${task.actual_finish_time || "--"} 完成。</p>
          ${quantityText}
          <div class="sheet-actions">
            <button class="btn" type="button" data-close-sheet>关闭</button>
            <button class="btn danger" type="button" data-revoke-task="${drum.drum_code}">撤回打卡</button>
          </div>
        </div>
      `;
    }

    function render() {
      const drum = currentDrum();
      if (!drum) {
        summaryCard.innerHTML = `
          <p class="order-code-line">暂无锅筒数据</p>
          <p>请先完成锅筒图号登记，并打印二维码后再扫码打卡。</p>
        `;
        progressList.innerHTML = "";
        return;
      }
      const state = stateStore.loadState();
      const orderDrums = state.drums
        .filter((item) => item.production_order_no === drum.production_order_no)
        .sort((a, b) => a.drawing_no.localeCompare(b.drawing_no, "zh-Hans-CN"));
      const completedCount = drum.tasks.filter((task) => task.status === "已完成").length;
      summaryCard.innerHTML = `
        <p class="order-code-line"><span>生产令号：</span><strong>${drum.production_order_no}</strong></p>
        <p class="summary-project">项目：${drum.project_name}</p>
        <p>锅筒数量：${orderDrums.length || 1} 个</p>
        <p>当前锅筒图号：${compactDrawingNo(drum.drawing_no)}</p>
        <p>钢板数量：${drum.plate_count || 1} 张</p>
        <p class="completion-line">已完成工序：<strong>${completedCount}</strong>/${drum.tasks.length}</p>
      `;
      progressList.innerHTML = drum.tasks.map((task, index) => {
        const canFinish = task.status !== "已完成" || needsQuantity(task);
        const visualState = taskVisualState(task);
        return `
        <div id="task-${index + 1}" class="progress-row ${visualState} ${canFinish ? "actionable" : ""}" data-task-id="${task.task_id}">
          <div class="process-main">
            <strong>${task.process_name}</strong>
            ${needsQuantity(task) ? quantityProgressHtml(drum, task) : ""}
          </div>
        </div>
      `;
      }).join("");
    }

    progressList.addEventListener("click", (event) => {
      const row = event.target.closest(".progress-row");
      if (!row || isAdvancing) return;
      const drum = currentDrum();
      const task = drum.tasks.find((item) => item.task_id === row.dataset.taskId);
      if (!task) return;
      if (task.status === "已完成" && !needsQuantity(task)) {
        openCompletedSheet(drum, task);
        return;
      }
      openActionSheet(drum, task);
    });

    actionSheet.addEventListener("click", (event) => {
      if (event.target.closest("[data-close-sheet]")) {
        closeActionSheet();
        return;
      }
      const correctButton = event.target.closest("[data-correct-record]");
      if (correctButton) {
        const drum = currentDrum();
        const task = drum.tasks.find((item) => item.task_id === pendingTaskId);
        if (drum && task) openCorrectionSheet(drum, task, correctButton.dataset.correctRecord);
        return;
      }
      const submitCorrection = event.target.closest("[data-submit-correction]");
      if (submitCorrection && !isAdvancing) {
        const drum = currentDrum();
        const task = drum?.tasks.find((item) => item.task_id === pendingTaskId);
        const input = actionSheet.querySelector("#sheetCorrectionQuantity");
        const quantity = Number(input?.value);
        const maxQuantity = Number(input?.max) || 0;
        if (!task || !input || !Number.isInteger(quantity) || quantity < 0 || quantity > maxQuantity) {
          showToast(`数量需要在 0 到 ${maxQuantity} 张之间`);
          input?.focus();
          return;
        }
        isAdvancing = true;
        stateStore.correctQuantityRecord(drum.drum_code, submitCorrection.dataset.submitCorrection, quantity);
        closeActionSheet();
        window.setTimeout(() => {
          render();
          showToast(`${task.process_name} 数量已修改`);
          isAdvancing = false;
        }, 180);
        return;
      }
      const confirmButton = event.target.closest("[data-confirm-finish]");
      if (!confirmButton || isAdvancing) return;
      const drum = currentDrum();
      if (!drum) {
        showToast("未找到锅筒数据");
        closeActionSheet();
        return;
      }
      const task = drum.tasks.find((item) => item.task_id === pendingTaskId);
      const quantityInput = actionSheet.querySelector("#sheetQuantity");
      const finishQuantity = quantityInput ? Number(quantityInput.value) : 0;
      const targetQuantity = task && needsQuantity(task) ? stateStore.getProcessTargetQuantity(drum, task.process_name) : 0;
      const remainingQuantity = task && needsQuantity(task) ? stateStore.getTaskRemainingQuantity(drum, task) : 0;
      if (task && needsQuantity(task) && (quantityInput.value === "" || !Number.isInteger(finishQuantity) || finishQuantity <= 0)) {
        showToast(`${task.process_name} 需要填写今天完成数量`);
        quantityInput?.focus();
        return;
      }
      if (task && needsQuantity(task) && finishQuantity > remainingQuantity) {
        showToast(`今天完成数量不能超过 ${remainingQuantity} 张`);
        quantityInput?.focus();
        return;
      }
      isAdvancing = true;
      confirmButton.disabled = true;
      confirmButton.textContent = "提交中...";
      const result = stateStore.completeTask(confirmButton.dataset.confirmFinish, pendingTaskId, { finishQuantity });
      if (result.blockedReason === "already_reported_today") {
        showToast("今日已打卡，请在历史日报数量中修改记录");
        isAdvancing = false;
        confirmButton.disabled = false;
        confirmButton.textContent = "确认打卡";
        return;
      }
      if (!result.task) {
        showToast("未找到锅筒数据");
        isAdvancing = false;
        closeActionSheet();
        render();
        return;
      }
      if (needsQuantity(result.task) && result.task.status !== "已完成") {
        showToast(`${result.task.process_name} 今天已记录 ${finishQuantity} 张`);
      } else {
        showToast(`${result.task.process_name} 已完成`);
      }
      closeActionSheet();
      window.setTimeout(() => {
        render();
        isAdvancing = false;
      }, 180);
    });

    actionSheet.addEventListener("click", (event) => {
      const revokeButton = event.target.closest("[data-revoke-task]");
      if (!revokeButton || isAdvancing) return;
      isAdvancing = true;
      revokeButton.disabled = true;
      revokeButton.textContent = "撤回中...";
      const result = stateStore.revokeTask(revokeButton.dataset.revokeTask, pendingTaskId);
      closeActionSheet();
      window.setTimeout(() => {
        render();
        showToast(result.task ? `${result.task.process_name} 已撤回` : "未找到工序");
        isAdvancing = false;
      }, 180);
    });

    render();
  </script>
</body>
</html>
